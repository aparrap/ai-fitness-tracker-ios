name: iOS Build

on:
  push:
    branches:
      - agent/detailed-workout-sync
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project "AI Fitness Tracker.xcodeproj" \
            -scheme "AI Fitness Tracker" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log
